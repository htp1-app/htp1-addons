// shairport-sync configuration for the HTP-1.
//
// Deployed to /var/lib/olympia/addons/airplay/etc/shairport-sync.conf and passed with
// --configfile; the compiled-in default path (/usr/local/etc) does not exist on
// the unit and nothing outside /opt/olympia is touched.
//
// Several settings here are not preferences -- they are workarounds for the
// apm100 / sun4i-i2s ALSA driver, and were each arrived at from an observed
// failure on the bench. Read the comments before changing any of them.

general = {
        // Overwritten at startup by airplay.service with the unit's own name
        // from /var/lib/olympia/unitname.txt, so the AirPlay picker shows what
        // the owner called the box rather than a generic string.
        name = "HTP-1";

        output_backend = "alsa";

        // resync_threshold_in_seconds is left at the shairport default (0.05).
        // It was set to 0 during debugging, on the theory that this driver's
        // erratic snd_pcm_delay() was making shairport resync against noise --
        // but disable_standby_mode turned out to be the real cause of the
        // stutter, so the override was removed and the default restored.

        // Volume is the HTP-1's own, applied downstream in the DSP and the
        // analog stage. shairport does no software attenuation (that would be
        // lossy and would fight the processor); the sender's volume goes to
        // the unit as a fraction of its range -- the AirPlay equivalent of
        // Roon's "volume": {"type": "mso"}. See airplay-volume.sh.
        ignore_volume_control = "yes";
        run_this_when_volume_is_set = "/var/lib/olympia/addons/airplay/bin/airplay-volume.sh";
};

// These are read only from this group; under general they are silently ignored.
sessioncontrol = {
        // Runs before every stream opens the output device, a resume after a
        // pause included. The unit selects AirPlay, waking if it has to, and
        // the command returns once the I2S device is free -- another receiver
        // playing into it is restarted -- so the open that follows succeeds.
        run_this_before_play_begins = "/opt/olympia/addon-source start airplay";

        // Hold the device open until that command returns. This also makes the
        // volume command synchronous, which keeps volume reports in order.
        wait_for_completion = "yes";
};

alsa = {
        // Card 0 on the unit, "Olympia I2S" -- the same sink raat.json,
        // bluealsa-aplay and alsaloop all write to. It feeds the APM DSP.
        output_device = "default:I2S";

        // THE STUTTER FIX. Do not set this to "auto".
        //
        // In "auto", shairport writes silence between real audio to keep the
        // DAC awake, and on this device it thrashes -- the log fills with
        // keep_dac_busy toggling yes/no/yes, and the result is audio cutting in
        // and out many times a second. It also spawns the buffer-monitor thread
        // whose snd_pcm_delay() calls fail with EPIPE against this driver.
        // "never" (the shairport default) plays clean: zero toggles, zero
        // underruns, zero silence insertions.
        disable_standby_mode = "never";

        // THE UNDERRUN FIX. shairport's default period is 256 frames (5.8 ms at
        // 44.1k) and the A20's I2S DMA will not sustain it: the device underruns
        // on essentially every write and only digital silence reaches the DSP.
        // The symptom is deceptive -- the APM reports a healthy 44.1 kHz PCM
        // stream and "APM decoding", because a stream of zeros is still a valid
        // stream; the VU meters pinned at <-80 dB are what give it away.
        //
        // Every other producer on this box already uses a larger period: the
        // USB gadget loop runs --period 480, Roon a 0.2 s buffer.
        period_size = 1024;
        buffer_size = 16384;

        // Requested but NOT honoured -- hw_params still reports
        // MMAP_INTERLEAVED, because "default:I2S" goes through the plug chain.
        // Left in as documentation of intent; it made no difference either way.
        use_mmap_if_available = "no";

        // No mixer_control_name: there is no ALSA mixer on this card.
};

diagnostics = {
        // syslog only, and /var/log is a 50 MB log2ram tmpfs, so keep it quiet.
        // For timing problems set log_verbosity = 1 and statistics = "yes";
        // that is what exposed the underruns and the keep_dac_busy thrash.
        // Remember to put it back.
        log_verbosity = 0;
};
