# Drop-in installed to /etc/systemd/system/avahi-daemon.service.d/htp1.conf
# by the airplay addon's install hook.
#
# Avahi exists on this box for exactly one reason: shairport-sync needs it to
# advertise AirPlay 2. Nothing else references it. StopWhenUnneeded lets it
# follow the AirPlay service, so a user who turns AirPlay off genuinely stops
# it rather than leaving a responder running for a feature they disabled.
#
# Device discovery does NOT depend on this. htp1-mdns-svc publishes
# _htp1._tcp and the device hostname with its own responder and keeps working
# with avahi stopped -- verified on hardware.
[Unit]
StopWhenUnneeded=yes
